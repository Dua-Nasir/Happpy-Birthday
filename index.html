<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a14">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a14; --bg2:#171020; --ink:#f4ece4; --mute:#a99bb3;
  --flame:#ffb347; --rose:#ff6f91; --glow:rgba(255,179,71,.18);
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px circle at var(--mx,50%) var(--my,30%),var(--glow),transparent 70%);transition:background .2s}
section{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem max(1.25rem,env(safe-area-inset-right)) 5rem max(1.25rem,env(safe-area-inset-left));text-align:center}
h1,h2{font-family:var(--serif);font-weight:300;line-height:1.1;letter-spacing:-.02em}
h1{font-size:clamp(3rem,10vw,7.5rem)}
h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:2rem}
em{font-style:italic;color:var(--flame)}
p.lead{color:var(--mute);max-width:34ch;margin:1.5rem auto 0;font-size:1.05rem}
button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1px solid rgba(255,255,255,.25);
  padding:.9rem 2rem;min-height:48px;border-radius:999px;transition:.3s;backdrop-filter:blur(6px);touch-action:manipulation}
button:active,button:focus-visible{background:var(--ink);color:var(--bg);outline:none}
@media (hover:hover){button:hover{background:var(--ink);color:var(--bg)}}
.hidden{opacity:0;pointer-events:none;transform:translateY(14px)}
.reveal{transition:opacity 1.2s ease,transform 1.2s ease}

/* Candle */
.candle{position:relative;width:46px;height:150px;margin:0 auto 2.5rem;cursor:pointer;background:none;border:0;padding:0;border-radius:0}
.candle:hover,.candle:active,.candle:focus-visible{background:none}
.candle::after{content:"";position:absolute;inset:-40px -50px -10px}
.wax{position:absolute;bottom:0;left:0;right:0;height:110px;border-radius:6px 6px 10px 10px;
  background:linear-gradient(90deg,#e8d6c3,#fff4e6 45%,#d9c2ab)}
.wick{position:absolute;bottom:108px;left:50%;width:3px;height:14px;margin-left:-1.5px;background:#2a1d1d;border-radius:2px}
.flame{position:absolute;bottom:118px;left:50%;width:22px;height:48px;margin-left:-11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff6d0 0,var(--flame) 45%,var(--rose) 100%);
  transform-origin:50% 100%;transform:scale(0);filter:blur(.5px);box-shadow:0 0 60px 20px rgba(255,179,71,.45);
  transition:transform .8s cubic-bezier(.2,1.4,.4,1)}
.lit .flame{transform:scale(1);animation:flicker 1.6s infinite alternate ease-in-out}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06,.96) rotate(1.5deg)}100%{transform:scale(.97,1.04) rotate(-1deg)}}
.hint{color:var(--mute);font-size:.9rem;letter-spacing:.04em;animation:pulse 2.4s infinite}
.lit+.hint{display:none}
@keyframes pulse{50%{opacity:.35}}

/* Photo */
.frame{position:relative;width:min(88vw,380px);aspect-ratio:3/4;border-radius:200px 200px 24px 24px;overflow:hidden;
  border:1px solid rgba(255,255,255,.2);background:var(--bg2);cursor:pointer;
  box-shadow:0 0 0 12px var(--bg),0 0 0 13px rgba(255,179,71,.35),0 40px 80px rgba(0,0,0,.6)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:none}
.frame.has img{display:block}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;color:var(--mute);padding:2rem;font-size:.95rem}
.placeholder b{font-family:var(--serif);font-weight:300;font-size:1.6rem;color:var(--ink)}
.frame.has .placeholder{display:none}
.caption{font-family:var(--serif);font-style:italic;color:var(--mute);margin-top:2.5rem;font-size:1.2rem}

/* Letter */
.letter{max-width:30ch;min-height:9rem;font-family:var(--serif);font-size:clamp(1.5rem,4vw,2.2rem);font-weight:300;line-height:1.4;transition:opacity .5s}
.dots{display:flex;gap:.5rem;margin:2rem 0}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:.4s}
.dots i.on{background:var(--flame);transform:scale(1.5)}

/* Reasons */
.reasons{display:grid;grid-template-columns:1fr;gap:1.2rem;width:min(100%,480px)}
.reason{min-height:200px;padding:2rem 1.5rem;text-align:left;border-radius:20px;background:var(--bg2);border:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.4s}
.reason:active,.reason.open{border-color:rgba(255,179,71,.5)}
@media (hover:hover){.reason:hover{border-color:rgba(255,179,71,.5)}}
.reason h3{font-family:var(--serif);font-weight:300;font-size:3.5rem;line-height:1.1;letter-spacing:.05em}
.reason p{color:var(--mute);font-size:.95rem;max-height:0;opacity:0;overflow:hidden;transition:.6s}
.reason.open p{max-height:500px;opacity:1;margin-top:1rem}
.reason small{color:var(--flame);font-size:.8rem}

.note{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:rgba(14,10,20,.75);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .6s}
.note.show{opacity:1;pointer-events:auto}
.paper{max-width:420px;width:100%;padding:2.5rem 2rem 2rem;border-radius:6px;background:#f6ecde;color:#3a2a2a;font-family:var(--serif);font-size:1.25rem;line-height:1.6;text-align:left;
  transform:translateY(60px) rotate(-2deg) scale(.94);transition:transform .9s cubic-bezier(.2,1.2,.4,1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.note.show .paper{transform:none}
.paper button{margin-top:1.5rem;color:#3a2a2a;border-color:rgba(58,42,42,.35)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.finale-name{color:var(--rose);font-style:italic}
@media (max-width:600px){
  body{font-size:16px}
  h1{font-size:clamp(2.6rem,13vw,4rem)}
  .candle{transform:scale(1.15);margin-bottom:3rem}
  .frame{width:min(82vw,340px);border-radius:170px 170px 20px 20px}
  .reasons{grid-template-columns:1fr}
  .reason{min-height:0;gap:1rem;padding:1.5rem 1.25rem}
  .letter{min-height:11rem}
  button{width:100%;max-width:320px}
}
@media (max-height:520px) and (orientation:landscape){section{padding:3rem 1.25rem}.candle{transform:scale(.8);margin-bottom:1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- 1 · Candle -->
<section id="intro">
  <button class="candle" id="candle" aria-label="Light the candle">
    <span class="flame"></span><span class="wick"></span><span class="wax"></span>
  </button>
  <p class="hint">Tap the candle</p>
  <div id="title" class="hidden reveal">
    <h1>Happy birthday,<br><em id="nameEl">Name</em></h1>
    <p class="lead" id="introLine"></p>
    <p style="margin-top:2.5rem"><button onclick="document.getElementById('photo').scrollIntoView()">Begin</button></p>
  </div>
</section>

<!-- 2 · Photo -->
<section id="photo">
  <h2>This is <em>us</em></h2>
  <label class="frame" id="frame" tabindex="0">
    <img id="pic" alt="Your photo">
    <div class="placeholder"><b>Your photo here</b>Click to choose a picture<br>(or set PHOTO in the script)</div>
    <input type="file" accept="image/*" id="file" hidden>
  </label>
  <p class="caption" id="captionEl"></p>
</section>

<!-- 3 · Letter -->
<section id="letter">
  <h2>A few things I want to say</h2>
  <p class="letter" id="line"></p>
  <div class="dots" id="dots"></div>
  <button id="next">Next</button>
</section>

<!-- 4 · Reasons -->
<section id="reasons">
  <h2>What's so special<br>about <em>you</em></h2>
  <div class="reasons" id="reasonGrid"></div>
</section>

<!-- 5 · Finale -->
<section id="finale">
  <div class="candle lit" id="candle2" style="pointer-events:none"><span class="flame"></span><span class="wick"></span><span class="wax"></span></div>
  <h2>Make a wish,<br><span class="finale-name" id="name2">Name</span></h2>
  <p class="lead">Close your eyes. Think of it. Then blow out the candle.</p>
  <p style="margin-top:2.5rem"><button id="wish">Blow out the candle</button></p>
  <p class="caption" id="sign" style="margin-top:3rem"></p>
</section>

<div class="note" id="note" role="dialog" aria-label="A little note">
  <div class="paper"><p id="noteText"></p><button id="noteClose">Close</button></div>
</div>

<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const CONFIG = {
  name: "Hassan",
  finalName: "Hassaan",
  from: "With love ❤️",
  introLine: "Today is entirely about you. I made this little place just for you.",
  PHOTO: "photo.jpeg",             // photo file sits in the same folder as this html
  caption: "Us, in one of my favourite photos.",
  letter: [
    "Firstly Hii! How are you? Hope aj ka din axha gaya hoga 😊",
    "Honestly mera pass bhi koi idea nhi h ka letter kaisa likho",
    "Mujha bhi kuch special ki kerna tha to soucha thora mera development mindset chalo 😂",
    "almost 6 months together & thinking of our first meetup & now! bahat sari positive changes",
    "bahat sari chiza h jo mujha apki pasand h or usma sa subsa top per h that your pretty supportive & understanding ❤️"
  ],
  reasons: [
    { t: "US", d: "i love the way we share choti choti chiza jo hum roz kerta h kabhi kabhi nhi kio ka ma soo jati thi kabhi & the way our endless series & movie talks thats unbeatable." }
  ],
  finalNote: "& Yessh! I am also really happy that you became the part of my life ONCE again HaPpy BIrtHdaY also maina jo 7 din sa pakkaya advance happy Birthday bol bol ka so no sorry bear with it 😅💗"
};
/* ================================================== */

const $ = id => document.getElementById(id);
$('nameEl').textContent = CONFIG.name;
$('name2').textContent = CONFIG.finalName;
$('introLine').textContent = CONFIG.introLine;
$('captionEl').textContent = CONFIG.caption;
$('sign').textContent = CONFIG.from;
$('noteText').textContent = CONFIG.finalNote;

// Soft light that follows the cursor
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  document.body.style.setProperty('--mx', e.clientX + 'px');
  document.body.style.setProperty('--my', e.clientY + 'px');
});

// 1 · Light the candle
$('candle').addEventListener('click', () => {
  $('candle').classList.add('lit');
  $('title').classList.remove('hidden');
  burst(innerWidth / 2, innerHeight * .3, 40);
});

// 2 · Photo
const frame = $('frame'), pic = $('pic');
function setPic(src){ pic.src = src; frame.classList.add('has'); }
// If photo.jpeg is missing or in the wrong folder, use the copy built into this file
pic.onerror = () => { pic.onerror = null; pic.src = BACKUP_PHOTO; };
if (CONFIG.PHOTO) setPic(CONFIG.PHOTO);
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) setPic(URL.createObjectURL(f));
});
frame.addEventListener('keydown', e => { if (e.key === 'Enter') $('file').click(); });

// 3 · Letter, one line at a time
let i = 0;
const line = $('line'), dots = $('dots');
CONFIG.letter.forEach(() => dots.appendChild(document.createElement('i')));
function show(){
  line.style.opacity = 0;
  setTimeout(() => {
    line.textContent = CONFIG.letter[i];
    line.style.opacity = 1;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    $('next').textContent = i === CONFIG.letter.length - 1 ? 'Continue' : 'Next';
  }, 350);
}
show();
$('next').addEventListener('click', () => {
  if (i < CONFIG.letter.length - 1){ i++; show(); }
  else $('reasons').scrollIntoView();
});

// 4 · Reasons
CONFIG.reasons.forEach(r => {
  const el = document.createElement('div');
  el.className = 'reason'; el.tabIndex = 0;
  el.innerHTML = `<h3>${r.t}</h3><p>${r.d}</p><small>Tap to open</small>`;
  const toggle = () => el.classList.toggle('open');
  el.onclick = toggle;
  el.onkeydown = e => { if (e.key === 'Enter') toggle(); };
  $('reasonGrid').appendChild(el);
});

// 5 · Confetti
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [];
let dpr = Math.min(devicePixelRatio || 1, 2);
function size(){ cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
size(); addEventListener('resize', size);
function burst(x, y, n){
  const cols = ['#ffb347','#ff6f91','#f4ece4','#c58bff'];
  for (let k = 0; k < n; k++){
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 7;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: 3 + Math.random() * 4,
      c: cols[k % cols.length], life: 120 + Math.random() * 60, rot: Math.random() * 6});
  }
  if (parts.length === n) loop();
}
function loop(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.vy += .18; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.rot += .1;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.min(1, p.life / 40); cx.fillStyle = p.c;
    cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore();
  });
  if (parts.length) requestAnimationFrame(loop);
}
$('noteClose').addEventListener('click', () => $('note').classList.remove('show'));
$('wish').addEventListener('click', () => {
  $('wish').textContent = 'Read the note again';
  $('candle2').classList.remove('lit');
  setTimeout(() => $('note').classList.add('show'), 1600);
  for (let k = 0; k < 6; k++)
    setTimeout(() => burst(Math.random() * innerWidth, innerHeight * (.2 + Math.random() * .4), 50), k * 250);
});
